<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AI 对话助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- 移动端侧边栏遮罩 -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    
    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🤖</span>
          <h2>AI 助手</h2>
        </div>
        <button class="close-sidebar" id="closeSidebarBtn">&times;</button>
      </div>
      <button class="new-chat-btn" id="newChatBtn">
        <span class="btn-icon">+</span>
        <span>新建对话</span>
      </button>
      <div class="chat-list" id="chatList">
        <div class="empty-chats">
          <p>暂无对话记录</p>
        </div>
      </div>
      <div class="sidebar-footer">
        <button class="settings-btn" id="settingsBtn">
          <span class="btn-icon">⚙️</span>
          <span>设置</span>
        </button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main id="mainContent" class="main-content">
      <!-- 顶部导航 -->
      <header class="top-nav">
        <button class="menu-btn" id="menuBtn">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <h1 class="app-title">AI 对话助手</h1>
        <button class="model-btn" id="modelBtn">
          <span id="currentModelName">选择模型</span>
          <span class="dropdown-arrow">&#9662;</span>
        </button>
      </header>

      <!-- 欢迎页面 -->
      <div id="welcomePage" class="page welcome-page">
        <div class="welcome-content">
          <div class="welcome-icon">🤖</div>
          <h1>AI 对话助手</h1>
          <p>支持文本对话、图片生成、视频生成和图像识别</p>
          <div class="features">
            <div class="feature-item">
              <span class="feature-icon">💬</span>
              <span>智能对话</span>
            </div>
            <div class="feature-item">
              <span class="feature-icon">🖼️</span>
              <span>图片生成</span>
            </div>
            <div class="feature-item">
              <span class="feature-icon">🎬</span>
              <span>视频生成</span>
            </div>
            <div class="feature-item">
              <span class="feature-icon">👁️</span>
              <span>图像识别</span>
            </div>
          </div>
          <button class="start-btn" id="startChatBtn">开始对话</button>
        </div>
      </div>

      <!-- 聊天页面 -->
      <div id="chatPage" class="page chat-page hidden">
        <div class="chat-header">
          <h3 id="chatTitle" class="chat-title">新对话</h3>
          <button class="delete-chat-btn" id="deleteChatBtn" title="删除对话">&times;</button>
        </div>
        
        <!-- 模型选择下拉 -->
        <div class="model-dropdown" id="modelDropdown">
          <input type="text" id="modelSearch" placeholder="搜索模型...">
          <div id="modelList" class="model-list">
            <div class="model-empty">请先在设置中发现模型</div>
          </div>
        </div>

        <div class="messages-container" id="messagesContainer">
          <div class="welcome-message">
            <p>你好！我是 AI 助手 🤖</p>
            <p>请选择模型后开始对话。</p>
          </div>
        </div>

        <div class="input-area">
          <div class="image-preview" id="imagePreview" style="display:none;">
            <img id="previewImg" src="" alt="预览">
            <button class="remove-image" id="removeImageBtn">&times;</button>
          </div>
          <div class="input-toolbar">
            <button class="tool-btn" id="imageUploadBtn" title="上传图片">
              <span>🖼️</span>
            </button>
            <input type="file" id="imageInput" accept="image/*" class="hidden-input">
          </div>
          <div class="input-wrapper">
            <textarea id="messageInput" placeholder="输入消息..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" disabled>
              <span>&#10148;</span>
            </button>
          </div>
          <div class="input-footer">
            <span id="charCount">0 字符</span>
            <div class="quick-actions">
              <button class="quick-btn" data-action="image">🎨 生图</button>
              <button class="quick-btn" data-action="video">🎬 视频</button>
              <button class="quick-btn" data-action="vision">👁️ 识图</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 设置页面 -->
      <div id="settingsPage" class="page settings-page hidden">
        <div class="settings-header">
          <h3>API 设置</h3>
          <button class="close-btn" id="closeSettingsBtn">&times;</button>
        </div>
        <div class="settings-content">
          <div class="setting-section">
            <h4>OpenAI 兼容接口</h4>
            <div class="form-group">
              <label>API Key</label>
              <div class="input-with-btn">
                <input type="password" id="apiKeyInput" placeholder="sk-...">
                <button class="toggle-key-btn" id="toggleKeyBtn">👁️</button>
              </div>
            </div>
            <div class="form-group">
              <label>Base URL</label>
              <input type="text" id="baseUrlInput" placeholder="https://api.openai.com/v1">
            </div>
            <button class="discover-btn" id="discoverModelsBtn">
              <span>🔍</span> 发现模型
            </button>
            <div id="discoveryStatus" class="discovery-status"></div>
          </div>

          <div class="setting-section">
            <h4>常用 API 模板</h4>
            <div class="template-grid">
              <button class="template-card" data-url="https://api.deepseek.com/v1" data-key="DEEPSEEK">
                <div class="template-icon">🔵</div>
                <div class="template-info">
                  <span class="template-name">DeepSeek</span>
                  <span class="template-url">api.deepseek.com</span>
                </div>
              </button>
              <button class="template-card" data-url="https://api.openai.com/v1" data-key="OPENAI">
                <div class="template-icon">🟢</div>
                <div class="template-info">
                  <span class="template-name">OpenAI</span>
                  <span class="template-url">api.openai.com</span>
                </div>
              </button>
              <button class="template-card" data-url="https://api.moonshot.cn/v1" data-key="MOONSHOT">
                <div class="template-icon">🌙</div>
                <div class="template-info">
                  <span class="template-name">Moonshot</span>
                  <span class="template-url">api.moonshot.cn</span>
                </div>
              </button>
              <button class="template-card" data-url="https://open.bigmodel.cn/api/paas/v4" data-key="ZHIPU">
                <div class="template-icon">🟣</div>
                <div class="template-info">
                  <span class="template-name">智谱 AI</span>
                  <span class="template-url">open.bigmodel.cn</span>
                </div>
              </button>
              <button class="template-card" data-url="https://dashscope.aliyuncs.com/compatible-mode/v1" data-key="ALIBABA">
                <div class="template-icon">🟠</div>
                <div class="template-info">
                  <span class="template-name">阿里云</span>
                  <span class="template-url">dashscope.aliyuncs.com</span>
                </div>
              </button>
            </div>
          </div>

          <div class="setting-section">
            <h4>已保存的 Key</h4>
            <div id="savedKeysList" class="saved-keys-list"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- 加载遮罩 -->
    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="loading-spinner"></div>
      <p>正在生成中...</p>
    </div>

    <!-- 图片预览模态框 -->
    <div id="imageModal" class="modal hidden">
      <div class="modal-content">
        <img id="modalImage" src="" alt="预览">
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
    </div>

    <!-- 错误提示 -->
    <div id="errorToast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
