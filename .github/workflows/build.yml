name: Build Android APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '34'
  BUILD_TOOLS_VERSION: '34.0.0'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-version: ${{ env.ANDROID_SDK_VERSION }}
        build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build APK
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-assistant-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

  build-multiple:
    name: Build Multiple Versions
    runs-on: ubuntu-latest
    needs: build
    
    strategy:
      matrix:
        version: [deepseek, openai, moonshot, zhipu, default]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build APK
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Rename APK
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk \
           android/app/build/outputs/apk/debug/ai-assistant-${{ matrix.version }}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-assistant-${{ matrix.version }}
        path: android/app/build/outputs/apk/debug/ai-assistant-${{ matrix.version }}.apk
        retention-days: 7